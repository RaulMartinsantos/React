<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React testes</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      function Alert1() {
        function handleAlertClick(event) {
          console.log(event);
          alert("Mensagem de alerta");
        }

        return (
          <button type="button" onClick={handleAlertClick}>
            Mostrar Alerta!
          </button>
        );
      }

      function Alert2() {
        function handleAlertParameter(msg) {
          alert(msg);
        }

        return (
          <button
            onClick={() => {
              handleAlertParameter("Uma mensagem");
            }}
          >
            Mostrar Alerta com parâmetro
          </button>
        );
      }

      function Alert3() {
        function handleCustomAlert(event) {
          alert(event.target.previousSibling.value);
        }

        function handleInputChange(event) {
          console.log(event.target.value);
        }

        return (
          <div>
            <input
              type="text"
              placeHolder="DigiteAlgo"
              onChange={handleInputChange}
            />
            <button type="button" onClick={handleCustomAlert}>
              Mostrar alerta
            </button>
          </div>
        );
      }

      function App() {
        return (
          <main>
            <Alert1 />
            <Alert2 />
            <Alert3 />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
